---
# =============================================================================
# Add Worker Nodes to OpenShift Cluster
# =============================================================================
# This playbook adds new worker nodes to an existing OpenShift cluster.
# It handles CSR approval, VM creation, and node registration.
# =============================================================================
- name: Add worker nodes to OpenShift cluster
  hosts: localhost
  gather_facts: false
  become_method: ansible.builtin.sudo

  vars:
    ansible_ssh_private_key_file: "~/.ssh/id_rsa"
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no"

  pre_tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - n_worker is defined
          - n_worker | int > 0
          - clustername is defined
          - clusters_dir is defined
        fail_msg: "Required variables must be defined and n_worker must be > 0"

  tasks:
    # -------------------------------------------------------------------------
    # Count Existing Workers
    # -------------------------------------------------------------------------
    - name: Get list of existing worker VMs
      ansible.builtin.shell: "virsh list --all --name | grep -E '{{ clustername }}.*worker' || true"
      register: existing_workers
      changed_when: false
      become: true

    - name: Count existing worker nodes
      ansible.builtin.set_fact:
        current_worker_count: "{{ existing_workers.stdout_lines | length | int }}"

    - name: Validate worker count increase
      ansible.builtin.assert:
        that:
          - n_worker | int > current_worker_count | int
        fail_msg: |
          n_worker ({{ n_worker }}) must be greater than current worker count ({{ current_worker_count }}).
          To add workers, increase n_worker in your configuration.

    - name: Display worker addition plan
      ansible.builtin.debug:
        msg: |
          ============================================================
          Adding Workers to Cluster '{{ clustername }}'
          ============================================================
          Current workers: {{ current_worker_count }}
          Target workers:  {{ n_worker }}
          New workers:     {{ n_worker | int - current_worker_count | int }}
          ============================================================

    # -------------------------------------------------------------------------
    # CSR Approver Setup
    # -------------------------------------------------------------------------
    - name: Deploy CSR Approver manifests (first worker addition)
      kubernetes.core.k8s:
        kubeconfig: "{{ clusters_dir }}/{{ clustername }}/auth/kubeconfig"
        state: present
        template: "{{ item }}.yaml.j2"
      loop:
        - csr-approver-ns
        - csr-approver-sa
        - csr-approver-cr
        - csr-approver-crb
        - csr-approver-rb
        - csr-approver-cronjob
      register: csr_approver_result
      until: csr_approver_result is succeeded
      retries: 30
      delay: 10
      when: current_worker_count | int == 0

    - name: Enable CSR approver cronjob
      kubernetes.core.k8s:
        kubeconfig: "{{ clusters_dir }}/{{ clustername }}/auth/kubeconfig"
        state: present
        definition:
          apiVersion: batch/v1
          kind: CronJob
          metadata:
            name: "ocp-csr-approver"
            namespace: "ocp-csr-approver"
          spec:
            suspend: false

    # -------------------------------------------------------------------------
    # Worker VM Creation
    # -------------------------------------------------------------------------
    - name: Create worker VM disks
      ansible.builtin.command: >
        qemu-img create -f qcow2
        {{ clusters_dir }}/{{ clustername }}/{{ clustername }}-worker-{{ item }}.qcow2 120G
      args:
        chdir: "{{ clusters_dir }}/{{ clustername }}"
        creates: "{{ clusters_dir }}/{{ clustername }}/{{ clustername }}-worker-{{ item }}.qcow2"
      with_sequence: "start={{ current_worker_count | int }} end={{ n_worker | int - 1 }}"

    - name: Define and start worker VMs
      ansible.builtin.command: >
        virt-install --import --name {{ clustername }}-worker-{{ item }}
        --disk {{ clusters_dir }}/{{ clustername }}/{{ clustername }}-worker-{{ item }}.qcow2,bus=virtio,size=120
        --disk {{ clusters_dir }}/{{ clustername }}/rhcos-worker.iso,device=cdrom
        --boot hd,cdrom --check path_in_use=off --noautoconsole
        --ram {{ worker_mem }} --cpu host --vcpus {{ worker_cpu }}
        --os-variant rhel9-unknown
        --network network={{ kvmnetwork }},model=virtio
        {{ '--network bridge=br1,model=virtio' if installocpvirt | default('false') == 'true' else '' }}
      args:
        chdir: "{{ clusters_dir }}/{{ clustername }}"
      with_sequence: "start={{ current_worker_count | int }} end={{ n_worker | int - 1 }}"
      become: true
      register: worker_vms_created

    # -------------------------------------------------------------------------
    # Wait for Worker IPs
    # -------------------------------------------------------------------------
    - name: Wait for worker VMs to get IP addresses
      ansible.builtin.shell: |
        virsh domifaddr {{ clustername }}-worker-{{ item }} | grep ipv4 | awk '{print $4}' | cut -d'/' -f1
      retries: 180
      delay: 3
      until: worker_ip.stdout != ""
      register: worker_ip
      with_sequence: "start={{ current_worker_count | int }} end={{ n_worker | int - 1 }}"
      become: true

    - name: Build worker IP list
      ansible.builtin.set_fact:
        new_worker_ips: "{{ worker_ip.results | map(attribute='stdout') | list }}"

    # -------------------------------------------------------------------------
    # Network Configuration
    # -------------------------------------------------------------------------
    - name: Get worker MAC addresses
      ansible.builtin.command: "virsh domifaddr {{ clustername }}-worker-{{ item }}"
      loop: "{{ range(current_worker_count | int, n_worker | int) | list }}"
      register: worker_interfaces
      become: true

    - name: Extract MAC addresses
      ansible.builtin.set_fact:
        worker_macs: "{{ worker_interfaces.results | map(attribute='stdout') | map('regex_findall', '([\\w:]{17})') | map('first') | list }}"

    - name: Configure DHCP reservations for workers
      community.libvirt.virt_net:
        name: "{{ kvmnetwork }}"
        command: modify
        xml: "<host mac='{{ worker_macs[item | int - current_worker_count | int] }}' ip='{{ new_worker_ips[item | int - current_worker_count | int] }}'/>"
      loop: "{{ range(current_worker_count | int, n_worker | int) | list }}"
      become: true

    - name: Add worker DNS entries
      ansible.builtin.lineinfile:
        path: "/etc/dnsmasq.{{ clustername }}.addnhosts"
        line: "{{ new_worker_ips[item | int - current_worker_count | int] }} {{ clustername }}-worker-{{ item }}.{{ basedomain }}"
        state: present
        create: true
        mode: '0644'
      loop: "{{ range(current_worker_count | int, n_worker | int) | list }}"
      become: true

    - name: Restart NetworkManager
      ansible.builtin.service:
        name: NetworkManager
        state: restarted
      become: true

    - name: Restart libvirtd
      ansible.builtin.service:
        name: libvirtd
        state: restarted
      become: true

    - name: Wait for services to stabilize
      ansible.builtin.pause:
        seconds: 5

    # -------------------------------------------------------------------------
    # RHCOS Installation on Workers
    # -------------------------------------------------------------------------
    - name: Wait for SSH availability on workers
      ansible.builtin.wait_for:
        host: "{{ new_worker_ips[item | int - current_worker_count | int] }}"
        port: 22
        timeout: 3600
        state: started
        sleep: 10
      loop: "{{ range(current_worker_count | int, n_worker | int) | list }}"

    - name: Copy worker.ign to worker nodes
      ansible.builtin.copy:
        src: "{{ clusters_dir }}/{{ clustername }}/worker.ign"
        dest: "/var/home/core/worker.ign"
        mode: "0644"
      delegate_to: "{{ new_worker_ips[item | int - current_worker_count | int] }}"
      loop: "{{ range(current_worker_count | int, n_worker | int) | list }}"
      remote_user: "core"

    - name: Install RHCOS on worker nodes
      ansible.builtin.shell: "coreos-installer install --ignition-file=/var/home/core/worker.ign /dev/vda"
      delegate_to: "{{ new_worker_ips[item | int - current_worker_count | int] }}"
      loop: "{{ range(current_worker_count | int, n_worker | int) | list }}"
      remote_user: "core"
      become: true

    - name: Reboot worker nodes
      ansible.builtin.reboot:
        reboot_timeout: 300
      delegate_to: "{{ new_worker_ips[item | int - current_worker_count | int] }}"
      loop: "{{ range(current_worker_count | int, n_worker | int) | list }}"
      remote_user: "core"
      become: true

    # -------------------------------------------------------------------------
    # Wait for Node Ready
    # -------------------------------------------------------------------------
    - name: Wait for SSH after reboot
      ansible.builtin.wait_for:
        host: "{{ new_worker_ips[item | int - current_worker_count | int] }}"
        port: 22
        timeout: 3600
        state: started
        sleep: 10
      loop: "{{ range(current_worker_count | int, n_worker | int) | list }}"

    - name: Wait for worker nodes to be Ready
      kubernetes.core.k8s_info:
        kind: Node
        kubeconfig: "{{ clusters_dir }}/{{ clustername }}/auth/kubeconfig"
        name: "{{ clustername }}-worker-{{ item }}.{{ basedomain }}"
      register: node_info
      retries: 120
      delay: 10
      until:
        - node_info.resources | length > 0
        - node_info.resources[0].status.conditions | selectattr('type', 'equalto', 'Ready') | selectattr('status', 'equalto', 'True') | list | length > 0
      loop: "{{ range(current_worker_count | int, n_worker | int) | list }}"

    # -------------------------------------------------------------------------
    # Disable CSR Approver
    # -------------------------------------------------------------------------
    - name: Pause CSR approver cronjob
      kubernetes.core.k8s:
        kubeconfig: "{{ clusters_dir }}/{{ clustername }}/auth/kubeconfig"
        state: present
        definition:
          apiVersion: batch/v1
          kind: CronJob
          metadata:
            name: "ocp-csr-approver"
            namespace: "ocp-csr-approver"
          spec:
            suspend: true

  post_tasks:
    - name: Display completion message
      ansible.builtin.debug:
        msg: |
          ============================================================
          Worker nodes added successfully!
          ============================================================
          New workers: {{ n_worker | int - current_worker_count | int }}
          Total workers: {{ n_worker }}
          
          Verify with: oc get nodes
          ============================================================


