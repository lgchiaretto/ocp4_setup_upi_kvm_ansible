clustername: 'funny-flanders'
basedomain: 'chiaret.to'
ocpversion: 4.16.16
clusters_dir: "/labs"
sno: 'true'
destroy_if_exists: 'true'

# Network configuration
# kvmnetwork: only used when ocp_cluster_use_dedicated_network=false
# When ocp_cluster_use_dedicated_network=true, a new network <clustername>-net is created
kvmnetwork: 'default'

# Create dedicated network per cluster (recommended)
# true: creates <clustername>-net (automatically cleaned up on destroy)
# false: uses kvmnetwork above (user-managed, not removed on destroy)
ocp_cluster_use_dedicated_network: true

worker_mem: '4096'
worker_cpu: 4
n_worker: 0
master_mem: '32000'
master_cpu: 8
extra_disks: 0
extra_disk_size: 100
installodf: 'false'
installocpvirt : 'false'
local_quay_registry: ''
admin_user: ''
htpasswd_pass: 'Redhat@123'
remove_kubeadmin_user: 'false'
ssh_rsa: >-
  ssh-rsa AAAAB3Nza...
pullsecret: >-
  '{"auths":{"cloud.op..}}'
