clustername: 'funny-flanders'
basedomain: 'chiaret.to'
ocpversion: 4.16.16
clusters_dir: "/labs"
sno: 'true'
destroy_if_exists: 'true'
kvmnetwork: 'default'

# Use libvirt network with integrated DNS (recommended) - set to true to enable
# This eliminates the need for NetworkManager dnsmasq configuration
# When enabled, DNS is configured directly in the libvirt network (like Terraform approach)
ocp_cluster_use_libvirt_network_dns: false

worker_mem: '4096'
worker_cpu: 4
n_worker: 0
master_mem: '32000'
master_cpu: 8
extra_disks: 0
extra_disk_size: 100
installodf: 'false'
installocpvirt : 'false'
local_quay_registry: ''
admin_user: ''
htpasswd_pass: 'Redhat@123'
remove_kubeadmin_user: 'false'
ssh_rsa: >-
  ssh-rsa AAAAB3Nza...
pullsecret: >-
  '{"auths":{"cloud.op..}}'
