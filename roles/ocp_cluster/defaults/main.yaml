---
ocp_major_version: "{{ ocpversion.split('.')[0] }}"

# RHCOS path inside the mirror: v4 uses "{minor}/latest", v5+ uses just "latest"
# because the v5 mirror has no 5.x RHCOS directories (RHCOS still uses 4.x versioning)
ocp_rhcos_path: "{{ 'latest' if (ocp_major_version | int) >= 5 else (ocpversion | regex_replace('(\\d+\\.\\d+).*', '\\1')) + '/latest' }}"

ocp_cluster_mirror_url: "https://mirror.openshift.com/pub/openshift-v{{ ocp_major_version }}/x86_64/dependencies/rhcos/"

ocp_cluster_python_packages:
  - kubernetes
  - passlib

ocp_cluster_required_packages:
  - qemu-kvm
  - libvirt
  - virt-install
  - virt-manager
  - guestfs-tools
  - python3-pip
  - coreos-installer

ocp_cluster_lso_manifests:
  - local-storage-namespace
  - odf-namespace

ocp_cluster_lso_operators:
  - local-storage-subscription
  - local-storage-operatorgroup
  - odf-subscription
  - odf-operatorgroup

ocp_cluster_ocpvirt_operators:
  - ocpvirt-subscription
  - ocpvirt-operatorgroup

ocp_cluster_csr_approver_manifests:
  - csr-approver-ns
  - csr-approver-sa
  - csr-approver-cr
  - csr-approver-crb
  - csr-approver-rb
  - csr-approver-cronjob
