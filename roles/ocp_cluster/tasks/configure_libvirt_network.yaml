---
# Configure libvirt network with integrated DNS

# Load network configuration if using dedicated network
- name: Load network configuration for dedicated network
  ansible.builtin.slurp:
    src: "{{ clusters_dir }}/{{ clustername }}/.network_config"
  register: network_config_file
  when: ocp_cluster_use_dedicated_network | default(true) | bool

- name: Parse network configuration
  ansible.builtin.set_fact:
    cluster_network_octet: "{{ (network_config_file.content | b64decode | regex_search('cluster_network_octet: (.+)', '\\1'))[0] }}"
    cluster_network_base: "{{ (network_config_file.content | b64decode | regex_search('cluster_network_base: (.+)', '\\1'))[0] }}"
  when: ocp_cluster_use_dedicated_network | default(true) | bool

# Determine which network to use
- name: Set network name (dedicated network)
  ansible.builtin.set_fact:
    ocp_network_name: "{{ clustername }}-net"
  when: ocp_cluster_use_dedicated_network | default(true) | bool

- name: Set network name (user-provided network)
  ansible.builtin.set_fact:
    ocp_network_name: "{{ kvmnetwork }}"
  when: not (ocp_cluster_use_dedicated_network | default(true) | bool)

# Backup existing network configuration if using user-provided network
- name: Check if user-provided network exists
  ansible.builtin.shell: "virsh net-list --all | grep -w {{ kvmnetwork }} || true"
  register: network_check
  become: true
  changed_when: false
  when: not (ocp_cluster_use_dedicated_network | default(true) | bool)

- name: Get current network XML configuration (user-provided network)
  ansible.builtin.shell: "virsh net-dumpxml {{ kvmnetwork }}"
  register: current_network_xml
  become: true
  changed_when: false
  when:
    - not (ocp_cluster_use_dedicated_network | default(true) | bool)
    - network_check.stdout != ""

- name: Save original network configuration as backup (user-provided network)
  ansible.builtin.copy:
    content: "{{ current_network_xml.stdout }}"
    dest: "{{ clusters_dir }}/{{ clustername }}/{{ kvmnetwork }}-original.xml"
    mode: '0644'
  when:
    - not (ocp_cluster_use_dedicated_network | default(true) | bool)
    - network_check.stdout != ""

# Generate network XML configuration
- name: Generate libvirt network XML for 3-node cluster
  ansible.builtin.template:
    src: "libvirt-network-3node.xml.j2"
    dest: "{{ clusters_dir }}/{{ clustername }}/{{ ocp_network_name }}-config.xml"
    mode: '0644'
  when: sno == "false"

- name: Generate libvirt network XML for SNO cluster
  ansible.builtin.template:
    src: "libvirt-network-sno.xml.j2"
    dest: "{{ clusters_dir }}/{{ clustername }}/{{ ocp_network_name }}-config.xml"
    mode: '0644'
  when: sno == "true"

# Check if network exists and is active
- name: Check if network exists
  ansible.builtin.shell: "virsh net-list --all | grep -w {{ ocp_network_name }} || true"
  register: network_exists
  become: true
  changed_when: false

- name: Check if network is active
  ansible.builtin.shell: "virsh net-info {{ ocp_network_name }} 2>/dev/null | grep 'Active:' | awk '{print $2}' || echo 'no'"
  register: network_active
  become: true
  changed_when: false
  when: network_exists.stdout != ""

# Manage network lifecycle
- name: Destroy network if active
  ansible.builtin.shell: "virsh net-destroy {{ ocp_network_name }}"
  become: true
  when:
    - network_exists.stdout != ""
    - network_active.stdout == "yes"
  ignore_errors: true

- name: Undefine existing network
  ansible.builtin.shell: "virsh net-undefine {{ ocp_network_name }}"
  become: true
  when: network_exists.stdout != ""
  ignore_errors: true

- name: Define network with DNS configuration
  ansible.builtin.shell: "virsh net-define {{ clusters_dir }}/{{ clustername }}/{{ ocp_network_name }}-config.xml"
  become: true

- name: Start network
  ansible.builtin.shell: "virsh net-start {{ ocp_network_name }}"
  become: true

- name: Set network to autostart
  ansible.builtin.shell: "virsh net-autostart {{ ocp_network_name }}"
  become: true

# Get network information
- name: Get network gateway IP for DNS
  ansible.builtin.shell: |
    virsh net-dumpxml {{ ocp_network_name }} | grep "ip address=" | sed -n "s/.*address='\([^']*\)'.*/\1/p"
  register: cluster_network_gateway
  become: true
  changed_when: false

- name: Display network configuration summary
  ansible.builtin.debug:
    msg: |
      ======================================
      Network Configuration Complete!
      ======================================
      Network name: {{ ocp_network_name }}
      Network type: {{ 'Dedicated (auto-cleanup on destroy)' if (ocp_cluster_use_dedicated_network | default(true) | bool) else 'Shared (user-managed)' }}
      Gateway/DNS server: {{ cluster_network_gateway.stdout }}
      ======================================

# Configure host DNS resolution via NetworkManager
- name: Get active network connection
  ansible.builtin.shell: "nmcli -t -f NAME,DEVICE connection show --active | head -n 1 | cut -d: -f1"
  register: active_connection
  become: true
  changed_when: false
  when: ocp_cluster_use_dedicated_network | default(true) | bool

- name: Get current DNS servers from NetworkManager
  ansible.builtin.shell: "nmcli -g ipv4.dns connection show '{{ active_connection.stdout }}' || echo ''"
  register: current_dns_servers
  become: true
  changed_when: false
  when: ocp_cluster_use_dedicated_network | default(true) | bool

- name: Add cluster network gateway as additional DNS server
  ansible.builtin.shell: "nmcli connection modify '{{ active_connection.stdout }}' +ipv4.dns '{{ cluster_network_gateway.stdout }}'"
  become: true
  when: 
    - ocp_cluster_use_dedicated_network | default(true) | bool
    - cluster_network_gateway.stdout not in (current_dns_servers.stdout | default(''))

- name: Reload NetworkManager connection to apply DNS changes
  ansible.builtin.shell: "nmcli connection up '{{ active_connection.stdout }}'"
  become: true
  when: 
    - ocp_cluster_use_dedicated_network | default(true) | bool
    - cluster_network_gateway.stdout not in (current_dns_servers.stdout | default(''))

- name: Configure dnsmasq to forward cluster domain queries
  ansible.builtin.copy:
    content: |
      # Forward DNS queries for {{ clustername }}.{{ basedomain }} to cluster DNS
      server=/{{ clustername }}.{{ basedomain }}/{{ cluster_network_gateway.stdout }}
    dest: "/etc/NetworkManager/dnsmasq.d/{{ clustername }}-cluster.conf"
    mode: '0644'
  become: true
  when: ocp_cluster_use_dedicated_network | default(true) | bool

- name: Reload NetworkManager to apply dnsmasq configuration
  ansible.builtin.systemd:
    name: NetworkManager
    state: reloaded
  become: true
  when: ocp_cluster_use_dedicated_network | default(true) | bool

- name: Save NetworkManager connection info for cleanup
  ansible.builtin.copy:
    content: |
      nm_connection: {{ active_connection.stdout }}
      cluster_dns_server: {{ cluster_network_gateway.stdout }}
      dnsmasq_conf: /etc/NetworkManager/dnsmasq.d/{{ clustername }}-cluster.conf
    dest: "{{ clusters_dir }}/{{ clustername }}/.nm_config"
    mode: '0644'
  when: ocp_cluster_use_dedicated_network | default(true) | bool

- name: Display DNS configuration status
  ansible.builtin.debug:
    msg: |
      DNS configuration completed:
      - Cluster DNS {{ cluster_network_gateway.stdout }} added to NetworkManager
      - Dnsmasq configured to forward {{ clustername }}.{{ basedomain }} to {{ cluster_network_gateway.stdout }}
  when: ocp_cluster_use_dedicated_network | default(true) | bool
