---
# =============================================================================
# Download and cache OCP resources
# =============================================================================
# Downloads are cached by OCP minor version (4.16, 4.17, etc.) for reuse
# across multiple cluster deployments.
# =============================================================================

# -----------------------------------------------------------------------------
# Setup Cache Directory
# -----------------------------------------------------------------------------
- name: Set cache directory path
  ansible.builtin.set_fact:
    ocp_cache_dir: "{{ clusters_dir }}/.cache/{{ ocpversion | regex_replace('(\\d+\\.\\d+).*', '\\1') }}"

- name: Create OCP version cache directory
  ansible.builtin.file:
    path: "{{ ocp_cache_dir }}"
    state: directory
    mode: '0755'
    owner: "{{ lookup('env', 'USER') }}"
  become: true

# -----------------------------------------------------------------------------
# Download OpenShift Installer
# -----------------------------------------------------------------------------
- name: Check if installer exists in cache
  ansible.builtin.stat:
    path: "{{ ocp_cache_dir }}/openshift-install-linux-{{ ocpversion }}.tar.gz"
  register: installer_cached

- name: Download OpenShift installer to cache
  ansible.builtin.get_url:
    url: "{{ ocp_cluster_client_url }}{{ ocpversion }}/openshift-install-linux.tar.gz"
    dest: "{{ ocp_cache_dir }}/openshift-install-linux-{{ ocpversion }}.tar.gz"
    mode: '0644'
    owner: "{{ lookup('env', 'USER') }}"
  become: true
  when: not installer_cached.stat.exists

# -----------------------------------------------------------------------------
# Download RHCOS Live ISO
# -----------------------------------------------------------------------------
- name: Check if RHCOS ISO exists in cache
  ansible.builtin.stat:
    path: "{{ ocp_cache_dir }}/rhcos.iso"
  register: rhcos_iso_cached

- name: Download RHCOS live ISO (OCP < 4.19)
  ansible.builtin.get_url:
    url: "{{ ocp_cluster_mirror_url }}{{ ocpversion | regex_replace('(\\d+\\.\\d+).*', '\\1') }}/latest/rhcos-live.x86_64.iso"
    dest: "{{ ocp_cache_dir }}/rhcos.iso"
    mode: '0644'
    owner: "{{ lookup('env', 'USER') }}"
  become: true
  when:
    - not rhcos_iso_cached.stat.exists
    - ocpversion is version('4.19', '<')

- name: Download RHCOS live ISO (OCP >= 4.19)
  ansible.builtin.get_url:
    url: "{{ ocp_cluster_mirror_url }}{{ ocpversion | regex_replace('(\\d+\\.\\d+).*', '\\1') }}/latest/rhcos-live-iso.x86_64.iso"
    dest: "{{ ocp_cache_dir }}/rhcos.iso"
    mode: '0644'
    owner: "{{ lookup('env', 'USER') }}"
  become: true
  when:
    - not rhcos_iso_cached.stat.exists
    - ocpversion is version('4.19', '>=')

# -----------------------------------------------------------------------------
# Download Additional RHCOS Images (3-node cluster only)
# -----------------------------------------------------------------------------
- name: Include RHCOS image download tasks for 3-node clusters
  ansible.builtin.include_tasks: download_rhcos_images.yaml
  when: sno | default('false') == 'false'
