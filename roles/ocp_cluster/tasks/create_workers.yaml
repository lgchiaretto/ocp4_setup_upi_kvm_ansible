---
# Create and configure worker VMs
# Workers should only be created AFTER cluster installation is complete

- name: Check if cluster is ready before creating workers
  ansible.builtin.shell: "oc --kubeconfig={{ clusters_dir }}/{{ clustername }}/auth/kubeconfig get nodes --no-headers | wc -l"
  register: node_count
  changed_when: false
  failed_when: node_count.stdout | int == 0

- name: Embed worker ignition into RHCOS ISO
  ansible.builtin.shell: |
    coreos-installer iso ignition embed \
      -i {{ clusters_dir }}/{{ clustername }}/worker.ign \
      -o {{ clusters_dir }}/{{ clustername }}/rhcos-worker-{{ item }}.iso \
      {{ clusters_dir }}/{{ clustername }}/rhcos.iso
  with_sequence: count={{ n_worker }} start=0
  become: true

- name: Create worker disk images
  ansible.builtin.shell: |
    qemu-img create -f qcow2 {{ clusters_dir }}/{{ clustername }}/{{ clustername }}-worker-{{ item }}.qcow2 120G
  with_sequence: count={{ n_worker }} start=0
  become: true

- name: Define KVM Workers
  ansible.builtin.command: virt-install --import --name {{ clustername }}-worker-{{ item }} \
        --disk {{ clusters_dir }}/{{ clustername }}/{{ clustername }}-worker-{{ item }}.qcow2,bus=virtio,size=120 \
        --disk {{ clusters_dir }}/{{ clustername }}/rhcos-worker-{{ item }}.iso,device=cdrom \
        --boot hd,cdrom --check path_in_use=off --noautoconsole \
        --ram {{ worker_mem }} --cpu host --vcpus {{ worker_cpu }} --os-variant rhel9-unknown \
        --network network={{ ocp_network_name }},model=virtio
  register: createworkers
  args:
    chdir: "{{ clusters_dir }}/{{ clustername }}"
  changed_when: createworkers.rc == 0
  with_sequence: count={{ n_worker }} start=0
  when: installocpvirt != "true"
  become: true

- name: Define KVM Workers when install OCP Virt
  ansible.builtin.command: virt-install --import --name {{ clustername }}-worker-{{ item }} \
        --disk {{ clusters_dir }}/{{ clustername }}/{{ clustername }}-worker-{{ item }}.qcow2,bus=virtio,size=120 \
        --disk {{ clusters_dir }}/{{ clustername }}/rhcos-worker-{{ item }}.iso,device=cdrom \
        --boot hd,cdrom --check path_in_use=off --noautoconsole \
        --ram {{ worker_mem }} --cpu host --vcpus {{ worker_cpu }} --os-variant rhel9-unknown \
        --network network={{ ocp_network_name }},model=virtio --network bridge=br1,model=virtio
  register: createworkers
  args:
    chdir: "{{ clusters_dir }}/{{ clustername }}"
  changed_when: createworkers.rc == 0
  with_sequence: count={{ n_worker }} start=0
  when: installocpvirt == "true"
  become: true

- name: Wait for the worker VM's to get an IP address
  ansible.builtin.shell: "virsh domifaddr {{ clustername }}-worker-{{ item }} | grep ipv4 | awk '{print $4}' | cut -d'/' -f1"
  retries: 180
  delay: 3
  until: workerip.stdout is defined and workerip.stdout != ""
  register: workerip
  with_sequence: count={{ n_worker }} start=0
  become: true

- name: Display worker IP addresses
  ansible.builtin.debug:
    msg: "Worker {{ clustername }}-worker-{{ item }} has IP: {{ workerip.results[item | int].stdout }}"
  with_sequence: count={{ n_worker }} start=0

- name: Wait for workers to install and reboot (RHCOS installation takes time)
  ansible.builtin.pause:
    minutes: 5
    prompt: "Waiting for workers to install RHCOS from embedded ignition and reboot..."

- name: Deploy CSR Auto-Approver for worker node approval
  ansible.builtin.shell: |
    oc --kubeconfig={{ clusters_dir }}/{{ clustername }}/auth/kubeconfig apply -f {{ clusters_dir }}/{{ clustername }}/{{ item }}.yaml
  loop:
    - csr-approver-ns
    - csr-approver-sa
    - csr-approver-cr
    - csr-approver-crb
    - csr-approver-rb
    - csr-approver-cronjob
  when: sno == "true"

- name: Wait for worker nodes to appear in cluster
  ansible.builtin.shell: |
    oc --kubeconfig={{ clusters_dir }}/{{ clustername }}/auth/kubeconfig get nodes --no-headers | grep -c worker || echo 0
  register: worker_node_count
  retries: 60
  delay: 10
  until: worker_node_count.stdout | int >= (n_worker | int)
  when: sno == "true"

- name: Display worker nodes status
  ansible.builtin.shell: |
    oc --kubeconfig={{ clusters_dir }}/{{ clustername }}/auth/kubeconfig get nodes
  register: nodes_status
  changed_when: false

- name: Show nodes
  ansible.builtin.debug:
    msg: "{{ nodes_status.stdout_lines }}"
