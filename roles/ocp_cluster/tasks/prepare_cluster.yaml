---
# =============================================================================
# Prepare cluster directory and configuration files
# =============================================================================

# -----------------------------------------------------------------------------
# Directory Setup
# -----------------------------------------------------------------------------
- name: Create cluster directory
  ansible.builtin.file:
    path: "{{ clusters_dir }}/{{ clustername }}"
    state: "directory"
    mode: "0755"
    owner: "{{ lookup('env', 'USER') }}"
  become: true

- name: Create rhcos-install directory (3-node only)
  ansible.builtin.file:
    path: "{{ clusters_dir }}/{{ clustername }}/rhcos-install"
    state: "directory"
    mode: "0755"
  when: sno | default('false') == 'false'

# -----------------------------------------------------------------------------
# Copy Installer and RHCOS Images
# -----------------------------------------------------------------------------
- name: Copy OpenShift installer to cluster directory
  ansible.builtin.copy:
    remote_src: true
    src: "{{ ocp_cache_dir }}/openshift-install-linux-{{ ocpversion }}.tar.gz"
    dest: "{{ clusters_dir }}/{{ clustername }}/"
    mode: '0644'

- name: Extract OpenShift installer
  ansible.builtin.unarchive:
    remote_src: true
    src: "{{ clusters_dir }}/{{ clustername }}/openshift-install-linux-{{ ocpversion }}.tar.gz"
    dest: "{{ clusters_dir }}/{{ clustername }}"

- name: Copy RHCOS ISO for master nodes (SNO)
  ansible.builtin.copy:
    remote_src: true
    src: "{{ ocp_cache_dir }}/rhcos.iso"
    dest: "{{ clusters_dir }}/{{ clustername }}/rhcos-master.iso"
    mode: '0644'
  when: sno | default('false') == 'true'

- name: Copy RHCOS ISO for worker nodes
  ansible.builtin.copy:
    remote_src: true
    src: "{{ ocp_cache_dir }}/rhcos.iso"
    dest: "{{ clusters_dir }}/{{ clustername }}/rhcos-worker.iso"
    mode: '0644'

# -----------------------------------------------------------------------------
# Install Configuration
# -----------------------------------------------------------------------------
- name: Generate install-config.yaml
  ansible.builtin.template:
    src: install-config.yaml-upi.j2
    dest: "{{ clusters_dir }}/{{ clustername }}/install-config.yaml"
    mode: '0644'

# -----------------------------------------------------------------------------
# RHCOS Files Setup (3-node only)
# -----------------------------------------------------------------------------
- name: Include RHCOS setup tasks for 3-node clusters
  ansible.builtin.include_tasks: prepare_rhcos_files.yaml
  when: sno | default('false') == 'false'

# -----------------------------------------------------------------------------
# Ignition Configuration
# -----------------------------------------------------------------------------
- name: Generate ignition configurations
  ansible.builtin.include_tasks: generate_ignition.yaml

# -----------------------------------------------------------------------------
# Cluster Information Files
# -----------------------------------------------------------------------------
- name: Create cluster information files
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ clusters_dir }}/{{ clustername }}/{{ item.dest }}"
    mode: '0644'
  loop:
    - { src: "clustername.json.j2", dest: "{{ clustername }}.json" }
    - { src: "create-tmuxp.yaml.j2", dest: "create-tmuxp.yaml" }
    - { src: "upgrade-tmuxp.yaml.j2", dest: "upgrade-tmuxp.yaml" }
  retries: 3
  delay: 2

# -----------------------------------------------------------------------------
# VM Management Scripts
# -----------------------------------------------------------------------------
- name: Create VM management scripts (start/stop)
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ clusters_dir }}/{{ clustername }}/{{ item.dest }}"
    mode: '0755'
  loop:
    - { src: "startvms.sh.j2", dest: "startvms.sh" }
    - { src: "stopvms.sh.j2", dest: "stopvms.sh" }
  retries: 3
  delay: 2

# -----------------------------------------------------------------------------
# Deployment Marker
# -----------------------------------------------------------------------------
- name: Create deployment started marker file
  ansible.builtin.file:
    path: "{{ clusters_dir }}/{{ clustername }}/started"
    state: touch
    mode: "0644"
  become: true