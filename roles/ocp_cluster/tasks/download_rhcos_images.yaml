---
# =============================================================================
# Download RHCOS images for 3-node cluster deployments
# =============================================================================
# These images are required for PXE booting and disk installation
# on non-SNO (3-node) cluster deployments.
# =============================================================================

# -----------------------------------------------------------------------------
# Check Cached Files
# -----------------------------------------------------------------------------
- name: Check if RHCOS qemu image exists in cache
  ansible.builtin.stat:
    path: "{{ ocp_cache_dir }}/rhcos-qemu.x86_64.qcow2"
  register: rhcos_qemu_cached

- name: Check if initramfs exists in cache
  ansible.builtin.stat:
    path: "{{ ocp_cache_dir }}/initramfs.img"
  register: initramfs_cached

- name: Check if kernel exists in cache
  ansible.builtin.stat:
    path: "{{ ocp_cache_dir }}/vmlinuz"
  register: kernel_cached

- name: Check if rootfs exists in cache
  ansible.builtin.stat:
    path: "{{ ocp_cache_dir }}/rhcos-live-rootfs.x86_64.img"
  register: rootfs_cached

# -----------------------------------------------------------------------------
# Download RHCOS Images
# -----------------------------------------------------------------------------
- name: Download RHCOS qemu image
  ansible.builtin.get_url:
    url: "{{ ocp_cluster_mirror_url }}{{ ocpversion | regex_replace('(\\d+\\.\\d+).*', '\\1') }}/latest/rhcos-qemu.x86_64.qcow2.gz"
    dest: "{{ ocp_cache_dir }}/rhcos-qemu.x86_64.qcow2.gz"
    mode: "0644"
  when: not rhcos_qemu_cached.stat.exists

- name: Download rootfs image
  ansible.builtin.get_url:
    url: "{{ ocp_cluster_mirror_url }}{{ ocpversion | regex_replace('(\\d+\\.\\d+).*', '\\1') }}/latest/rhcos-live-rootfs.x86_64.img"
    dest: "{{ ocp_cache_dir }}/rhcos-live-rootfs.x86_64.img"
    mode: "0644"
  when: not rootfs_cached.stat.exists

- name: Download initramfs image
  ansible.builtin.get_url:
    url: "{{ ocp_cluster_mirror_url }}{{ ocpversion | regex_replace('(\\d+\\.\\d+).*', '\\1') }}/latest/rhcos-live-initramfs.x86_64.img"
    dest: "{{ ocp_cache_dir }}/initramfs.img"
    mode: "0644"
  when: not initramfs_cached.stat.exists

- name: Download kernel image
  ansible.builtin.get_url:
    url: "{{ ocp_cluster_mirror_url }}{{ ocpversion | regex_replace('(\\d+\\.\\d+).*', '\\1') }}/latest/rhcos-live-kernel.x86_64"
    dest: "{{ ocp_cache_dir }}/vmlinuz"
    mode: "0644"
  when: not kernel_cached.stat.exists
