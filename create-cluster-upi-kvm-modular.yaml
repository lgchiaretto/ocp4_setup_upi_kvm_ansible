---
# =============================================================================
# OpenShift 4 UPI KVM Cluster Deployment - Modular Playbook
# =============================================================================
# This playbook deploys an OpenShift cluster on KVM using UPI method.
# Supports: Single Node OpenShift (SNO) and 3-node clusters
# =============================================================================
- name: Create OpenShift cluster (UPI on KVM)
  hosts: localhost
  gather_facts: true
  become_method: ansible.builtin.sudo

  vars:
    ansible_ssh_private_key_file: "~/.ssh/id_rsa"
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no"

  pre_tasks:
    - name: Display playbook information
      ansible.builtin.debug:
        msg: |
          ============================================================
          OpenShift UPI KVM Deployment
          ============================================================
          Cluster: {{ clustername | default('undefined') }}
          Domain:  {{ basedomain | default('undefined') }}
          Type:    {{ 'SNO' if sno | default('false') == 'true' else '3-Node' }}
          ============================================================

  roles:
    - ocp_cluster

  post_tasks:
    - name: Display cluster access information
      ansible.builtin.debug:
        msg: |
          ============================================================
          Cluster deployment completed successfully!
          ============================================================
          
          To access the cluster:
          
          export KUBECONFIG="{{ clusters_dir }}/{{ clustername }}/auth/kubeconfig"
          oc get nodes
          oc get clusterversion
          
          Console URL: https://console-openshift-console.apps.{{ clustername }}.{{ basedomain }}
          API URL: https://api.{{ clustername }}.{{ basedomain }}:6443
          
          VM Management:
          - Start: {{ clusters_dir }}/{{ clustername }}/startvms.sh
          - Stop:  {{ clusters_dir }}/{{ clustername }}/stopvms.sh
          ============================================================

