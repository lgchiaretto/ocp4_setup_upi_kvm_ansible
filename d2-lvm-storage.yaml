---
# =============================================================================
# Day 2: Install LVM Storage and Configure LVMCluster
# =============================================================================
# This playbook installs the LVM Storage Operator and configures an LVMCluster
# for persistent storage using local disks.
# =============================================================================
- name: Install LVM Storage and Configure LVMCluster
  hosts: localhost
  gather_facts: false
  become_method: ansible.builtin.sudo

  vars:
    lvmcluster_template: "templates/d2-storage-lvmcluster.yaml.j2"
    lvmcluster_file: "{{ clusters_dir }}/{{ clustername }}/d2-storage-lvmcluster.yaml"
    kubeconfig_path: "{{ clusters_dir }}/{{ clustername }}/auth/kubeconfig"

  pre_tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - clustername is defined
          - clusters_dir is defined
          - extra_disks is defined
        fail_msg: "Required variables must be defined"

  tasks:
    # -------------------------------------------------------------------------
    # Validate Extra Disks
    # -------------------------------------------------------------------------
    - name: Get master-0 VM information
      community.libvirt.virt:
        command: get_xml
        name: "{{ clustername }}-master-0"
      register: vm_info
      become: true

    - name: Parse XML to count disk devices
      community.general.xml:
        xmlstring: "{{ vm_info.get_xml }}"
        xpath: "/domain/devices/disk[target/@dev]"
        content: text
      register: disk_devices

    - name: Fail if no extra disks available
      ansible.builtin.fail:
        msg: |
          No extra disks found on master-0. LVM Storage requires at least one extra disk.
          Please redeploy with extra_disks >= 1 in your configuration.
      when: disk_devices.count <= 2

    - name: Display disk configuration
      ansible.builtin.debug:
        msg: "Found {{ disk_devices.count - 2 }} extra disk(s) available for LVM Storage"

    # -------------------------------------------------------------------------
    # Namespace and OperatorGroup
    # -------------------------------------------------------------------------
    - name: Ensure openshift-storage namespace exists
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: openshift-storage

    - name: Ensure OperatorGroup exists
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: operators.coreos.com/v1
          kind: OperatorGroup
          metadata:
            name: openshift-storage-operatorgroup
            namespace: openshift-storage
          spec:
            targetNamespaces:
              - openshift-storage

    # -------------------------------------------------------------------------
    # LVMS Operator Installation
    # -------------------------------------------------------------------------
    - name: Install LVMS Operator subscription
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: operators.coreos.com/v1alpha1
          kind: Subscription
          metadata:
            name: lvms
            namespace: openshift-storage
          spec:
            installPlanApproval: Automatic
            name: lvms-operator
            source: redhat-operators
            sourceNamespace: openshift-marketplace

    - name: Wait for LVM Storage operator to be installed
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: operators.coreos.com/v1alpha1
        kind: ClusterServiceVersion
        namespace: openshift-storage
      register: lvm_csv_check
      retries: 20
      delay: 30
      until:
        - lvm_csv_check.resources | length > 0
        - lvm_csv_check.resources[0].status.phase == 'Succeeded'

    - name: Display LVM Storage installation status
      ansible.builtin.debug:
        msg: "LVM Storage Operator status: {{ lvm_csv_check.resources[0].status.phase }}"

    # -------------------------------------------------------------------------
    # LVMCluster Configuration
    # -------------------------------------------------------------------------
    - name: Generate extra disks list
      ansible.builtin.set_fact:
        extra_disks_list: "{{ ocp_cluster_extra_disk_letters[:extra_disks | int] | default(['vdb', 'vdc', 'vdd', 'vde', 'vdf', 'vdg', 'vdh', 'vdi', 'vdj', 'vdk'][:extra_disks | int]) }}"

    - name: Display configured disks
      ansible.builtin.debug:
        msg: "Configuring LVMCluster with disks: {{ extra_disks_list }}"

    - name: Apply LVMCluster resource
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        template: "{{ lvmcluster_template }}"
        namespace: openshift-storage

    - name: Wait for LVMCluster to be Ready
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        api_version: lvm.topolvm.io/v1alpha1
        kind: LVMCluster
        namespace: openshift-storage
      register: lvmcluster_status
      retries: 20
      delay: 30
      until:
        - lvmcluster_status.resources | length > 0
        - lvmcluster_status.resources[0].status.state | default('') == 'Ready'

    # -------------------------------------------------------------------------
    # Validation Test
    # -------------------------------------------------------------------------
    - name: Create test PVC
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: lvms-test-pvc
            namespace: default
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
            storageClassName: lvms-vg1

    - name: Create test Pod
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: present
        definition:
          apiVersion: v1
          kind: Pod
          metadata:
            name: lvms-test-pod
            namespace: default
          spec:
            containers:
              - name: test
                image: busybox
                command: ["/bin/sh", "-c", "echo 'LVM Storage test successful' && sleep 30"]
                volumeMounts:
                  - mountPath: /data
                    name: test-volume
            volumes:
              - name: test-volume
                persistentVolumeClaim:
                  claimName: lvms-test-pvc
            restartPolicy: Never

    - name: Wait for test Pod to complete
      kubernetes.core.k8s_info:
        kubeconfig: "{{ kubeconfig_path }}"
        kind: Pod
        name: lvms-test-pod
        namespace: default
      register: pod_info
      until: pod_info.resources[0].status.phase in ['Succeeded', 'Running']
      retries: 30
      delay: 5

    - name: Clean up test resources
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig_path }}"
        state: absent
        kind: "{{ item.kind }}"
        name: "{{ item.name }}"
        namespace: default
      loop:
        - { kind: Pod, name: lvms-test-pod }
        - { kind: PersistentVolumeClaim, name: lvms-test-pvc }

  post_tasks:
    - name: Display completion message
      ansible.builtin.debug:
        msg: |
          ============================================================
          LVM Storage configured successfully!
          ============================================================
          
          StorageClass: lvms-vg1
          Disks: {{ extra_disks_list | join(', ') }}
          
          To use LVM storage in your applications:
          
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: my-pvc
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 10Gi
            storageClassName: lvms-vg1
          ============================================================
