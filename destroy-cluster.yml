- name: Destroy clusters UPI on KVM
  hosts: localhost
  gather_facts: false
  become: true
  become_method: ansible.builtin.sudo

  tasks:

    - name: Get a list of all virtual machines
      ansible.builtin.command: virsh list --all --name
      register: vms
      changed_when: vms.rc == 0

    - name: Filter VMs containing 'clustername' in their names
      ansible.builtin.set_fact:
        allvms: "{{ vms.stdout_lines | select('search', clustername) }}"

    - name: Destroy all vms
      ansible.builtin.command: virsh destroy {{ item }}
      loop: "{{ allvms }}"
      ignore_errors: true
      changed_when: true

    - name: Undefine all vms
      ansible.builtin.command: virsh undefine {{ item }} --remove-all-storage
      loop: "{{ allvms }}"
      ignore_errors: true
      changed_when: true

    - name: Cleanup network configuration
      ansible.builtin.include_role:
        name: ocp_cluster
        tasks_from: cleanup_network

    - name: Delete cluster directory
      ansible.builtin.file:
        path: "{{ clusters_dir }}/{{ clustername }}/"
        state: absent

    - name: Delete obsolete files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      with_items:
        - "/etc/dnsmasq.{{ clustername }}.addnhosts"

