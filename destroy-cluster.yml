---
# =============================================================================
# OpenShift Cluster Destruction Playbook
# =============================================================================
# This playbook completely removes an OpenShift cluster deployed on KVM.
# It removes: VMs, network configuration, DNS entries, and cluster files.
# =============================================================================
- name: Destroy OpenShift cluster (UPI on KVM)
  hosts: localhost
  gather_facts: false
  become: true
  become_method: ansible.builtin.sudo

  pre_tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - clustername is defined
          - clusters_dir is defined
        fail_msg: "Required variables 'clustername' and 'clusters_dir' must be defined"

    - name: Confirm cluster destruction
      ansible.builtin.debug:
        msg: |
          ============================================================
          WARNING: Destroying cluster '{{ clustername }}'
          ============================================================
          This will remove:
          - All VMs with '{{ clustername }}' in their name
          - DNS/DHCP configuration
          - Cluster directory: {{ clusters_dir }}/{{ clustername }}
          ============================================================

  tasks:
    # -------------------------------------------------------------------------
    # Virtual Machine Cleanup
    # -------------------------------------------------------------------------
    - name: Get list of all virtual machines
      ansible.builtin.command: virsh list --all --name
      register: vm_list
      changed_when: false

    - name: Filter VMs belonging to this cluster
      ansible.builtin.set_fact:
        cluster_vms: "{{ vm_list.stdout_lines | select('search', clustername) | list }}"

    - name: Display VMs to be destroyed
      ansible.builtin.debug:
        msg: "VMs to destroy: {{ cluster_vms }}"
      when: cluster_vms | length > 0

    - name: Destroy running VMs
      ansible.builtin.command: "virsh destroy {{ item }}"
      loop: "{{ cluster_vms }}"
      ignore_errors: true
      changed_when: true

    - name: Undefine VMs and remove storage
      ansible.builtin.command: "virsh undefine {{ item }} --remove-all-storage"
      loop: "{{ cluster_vms }}"
      ignore_errors: true
      changed_when: true

    # -------------------------------------------------------------------------
    # Network Configuration Cleanup
    # -------------------------------------------------------------------------
    - name: Remove network configuration files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/etc/NetworkManager/dnsmasq.d/{{ clustername }}.conf"
        - "/etc/dnsmasq.{{ clustername }}.addnhosts"
      register: network_files_deleted

    # -------------------------------------------------------------------------
    # Cluster Directory Cleanup
    # -------------------------------------------------------------------------
    - name: Remove cluster directory
      ansible.builtin.file:
        path: "{{ clusters_dir }}/{{ clustername }}/"
        state: absent

    # -------------------------------------------------------------------------
    # Service Restart
    # -------------------------------------------------------------------------
    - name: Restart libvirtd service
      ansible.builtin.service:
        name: libvirtd
        state: restarted
      when: cluster_vms | length > 0

    - name: Restart NetworkManager service
      ansible.builtin.service:
        name: NetworkManager
        state: restarted
      when: network_files_deleted.changed

  post_tasks:
    - name: Display completion message
      ansible.builtin.debug:
        msg: |
          ============================================================
          Cluster '{{ clustername }}' has been destroyed
          ============================================================
          Removed {{ cluster_vms | length }} VMs
          Network configuration cleaned up
          Cluster directory removed
          ============================================================

